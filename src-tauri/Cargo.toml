[package]
name = "nord-download-manager"
version = "0.1.0"
description = "Parallel download manager that routes every download through a NordVPN server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
wreq = { version = "=6.0.0-rc.31", features = ["json", "stream", "cookies", "gzip", "brotli", "zstd", "query"] }
sha2 = "0.10"
rand = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["windows-native"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
